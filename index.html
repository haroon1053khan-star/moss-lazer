
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mosquito Laser Shooter</title>
<style>
* { box-sizing: border-box; }
body {
    margin: 0;
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: linear-gradient(#101b38, #263b65);
    color: white;
    text-align: center;
    user-select: none;
}
h1 { margin: 12px 0 5px; color: #7affc2; }
#hud {
    display: flex;
    justify-content: space-around;
    font-size: 20px;
    font-weight: bold;
    padding: 10px;
}
#game {
    position: relative;
    width: 100%;
    height: 75vh;
    overflow: hidden;
    border-top: 3px solid #7affc2;
    border-bottom: 3px solid #7affc2;
    background:
      radial-gradient(circle at 20% 30%, #40577d 2px, transparent 3px),
      radial-gradient(circle at 80% 60%, #40577d 2px, transparent 3px),
      linear-gradient(#152746, #0b152a);
}
.mosquito {
    position: absolute;
    font-size: 43px;
    cursor: crosshair;
    transform: translate(-50%, -50%);
    animation: buzz .25s infinite alternate;
    z-index: 3;
}
@keyframes buzz {
    from { rotate: -12deg; }
    to { rotate: 12deg; }
}
.laser {
    position: absolute;
    height: 5px;
    background: #ff3434;
    box-shadow: 0 0 12px red, 0 0 22px red;
    transform-origin: left center;
    z-index: 5;
    pointer-events: none;
}
#overlay {
    position: absolute;
    inset: 0;
    background: #000a;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 10;
}
button {
    background: #37ffad;
    color: #10243a;
    border: none;
    border-radius: 12px;
    padding: 15px 35px;
    font-size: 22px;
    font-weight: bold;
    cursor: pointer;
}
#message {
    position: absolute;
    font-size: 30px;
    font-weight: bold;
    color: yellow;
    pointer-events: none;
    z-index: 8;
    animation: pop .5s forwards;
}
@keyframes pop {
    to { transform: translateY(-45px); opacity: 0; }
}
</style>
</head>
<body>

<h1>🦟 MOSQUITO LASER SHOOTER 🔫</h1>
<div id="hud">
    <span>Score: <span id="score">0</span></span>
    <span>Time: <span id="time">30</span>s</span>
    <span>Lives: <span id="lives">❤️❤️❤️</span></span>
</div>

<div id="game">
    <div id="overlay">
        <h2 id="title">MOSQUITO INVASION!</h2>
        <p id="description">Destroy those annoying mosquitoes!</p>
        <button id="start">START GAME</button>
    </div>
</div>

<script>
const game = document.getElementById("game");
const overlay = document.getElementById("overlay");
const scoreText = document.getElementById("score");
const timeText = document.getElementById("time");
const livesText = document.getElementById("lives");

let score = 0, lives = 3, time = 30;
let running = false;
let mosquitoes = [];
let spawnTimer, clockTimer;

function sound(type) {
    const audio = new (window.AudioContext || window.webkitAudioContext)();
    const osc = audio.createOscillator();
    const gain = audio.createGain();
    osc.connect(gain);
    gain.connect(audio.destination);

    if (type === "hit") {
        osc.type = "sawtooth";
        osc.frequency.setValueAtTime(180, audio.currentTime);
        osc.frequency.exponentialRampToValueAtTime(65, audio.currentTime + .25);
        gain.gain.setValueAtTime(.4, audio.currentTime);
        gain.gain.exponentialRampToValueAtTime(.01, audio.currentTime + .3);
        osc.start();
        osc.stop(audio.currentTime + .3);

        // Funny FAHH text + sound effect
        showMeme("FAHHHH! 💀");
    } else {
        osc.frequency.value = 100;
        gain.gain.value = .15;
        osc.start();
        osc.stop(audio.currentTime + .1);
    }
    setTimeout(() => audio.close(), 500);
}

function showMeme(text) {
    const msg = document.createElement("div");
    msg.id = "message";
    msg.textContent = text;
    msg.style.left = "50%";
    msg.style.top = "45%";
    game.appendChild(msg);
    setTimeout(() => msg.remove(), 500);
}

function shoot(mosquito) {
    if (!running) return;

    const rect = mosquito.getBoundingClientRect();
    const gameRect = game.getBoundingClientRect();

    const laser = document.createElement("div");
    laser.className = "laser";
    const x = game.clientWidth / 2;
    const y = game.clientHeight - 15;
    const tx = rect.left - gameRect.left + rect.width / 2;
    const ty = rect.top - gameRect.top + rect.height / 2;

    const angle = Math.atan2(ty-y, tx-x);
    const length = Math.hypot(tx-x, ty-y);

    laser.style.left = x + "px";
    laser.style.top = y + "px";
    laser.style.width = length + "px";
    laser.style.transform = `rotate(${angle}rad)`;
    game.appendChild(laser);
    setTimeout(() => laser.remove(), 150);

    score += 10;
    scoreText.textContent = score;
    sound("hit");
    mosquito.remove();
    mosquitoes = mosquitoes.filter(m => m !== mosquito);
}

function spawn() {
    if (!running) return;

    const m = document.createElement("div");
    m.className = "mosquito";
    m.textContent = "🦟";

    const x = 30 + Math.random() * (game.clientWidth - 60);
    const y = 30 + Math.random() * (game.clientHeight - 100);

    m.style.left = x + "px";
    m.style.top = y + "px";

    m.addEventListener("pointerdown", e => {
        e.stopPropagation();
        shoot(m);
    });

    game.appendChild(m);
    mosquitoes.push(m);

    // Mosquito flies away after a while
    setTimeout(() => {
        if (m.parentNode && running) {
            m.remove();
            mosquitoes = mosquitoes.filter(a => a !== m);
            lives--;
            livesText.textContent = "❤️".repeat(lives);
            if (lives <= 0) endGame();
        }
    }, 3500);
}

function startGame() {
    score = 0;
    lives = 3;
    time = 30;
    running = true;
    mosquitoes.forEach(m => m.remove());
    mosquitoes = [];

    scoreText.textContent = score;
    timeText.textContent = time;
    livesText.textContent = "❤️❤️❤️";
    overlay.style.display = "none";

    clearInterval(spawnTimer);
    clearInterval(clockTimer);

    spawnTimer = setInterval(spawn, 1000);

    clockTimer = setInterval(() => {
        time--;
        timeText.textContent = time;
        if (time <= 0) endGame();
    }, 1000);
}

function endGame() {
    if (!running) return;
    running = false;
    clearInterval(spawnTimer);
    clearInterval(clockTimer);
    mosquitoes.forEach(m => m.remove());
    mosquitoes = [];

    overlay.style.display = "flex";
    document.getElementById("title").textContent = "GAME OVER 💀";
    document.getElementById("description").textContent =
        "Your score: " + score + " | Mosquitoes destroyed!";
    document.getElementById("start").textContent = "PLAY AGAIN";
}

document.getElementById("start").addEventListener("click", startGame);
</script>
</body>
</html>
